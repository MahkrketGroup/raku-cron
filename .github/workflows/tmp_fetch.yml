name: TEMP fetch M5 (solo lectura, se borra al terminar)
on:
  workflow_dispatch:
    inputs:
      start: {required: true}
      symbols: {required: true}
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - env: {GH_PAT: "${{ secrets.GH_PAT }}"}
        run: git clone https://x-access-token:${GH_PAT}@github.com/MahkrketGroup/raku-shadow-resolver.git strategy
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - working-directory: strategy
        run: pip install -r requirements-check.txt
      - working-directory: strategy
        run: |
          cat > .env << 'EOT'
          CTRADER_CLIENT_ID=${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET=${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ENV=${{ secrets.CTRADER_ENV }}
          CTRADER_ACCESS_TOKEN=${{ secrets.CTRADER_ACCESS_TOKEN }}
          CTRADER_ACCOUNT_ID=${{ secrets.CTRADER_ACCOUNT_ID }}
          EOT
          python3 -u fetch_m5_recent.py --start "${{ inputs.start }}" --symbols "${{ inputs.symbols }}"
          rm -f .env
      - uses: actions/upload-artifact@v4
        with: {name: m5data, path: strategy/out_m5/, retention-days: 1}
